<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: 'Liberation Sans', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0f172a; }
      .subtitle { font-family: 'Liberation Sans', Arial, sans-serif; font-size: 13px; fill: #475569; }
      .box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
      .fail { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 8; }
      .pass { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .hdr { font-family: 'Liberation Sans', Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
      .txt { font-family: 'Liberation Mono', monospace; font-size: 11px; fill: #1e293b; }
      .arr { stroke: #334155; stroke-width: 2; fill: none; }
      .arr-r { stroke: #b91c1c; stroke-width: 2; fill: none; }
      .arr-g { stroke: #15803d; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="760"/>
  <text class="title" x="36" y="40">Autorun.upg Cryptographic Format &amp; Firmware Upgrade Decision State Machine</text>
  <text class="subtitle" x="36" y="62">Disassembly-verified execution paths across libdtv_common.so (DLM) and libmtkapp.so (_phm_upg_model)</text>

  <!-- Container Anatomy -->
  <rect class="box" x="36" y="88" width="1108" height="170"/>
  <text class="hdr" x="54" y="114">1. Autorun.upg Wire Structure (Verified via libdtv_common.so &amp; verify_upg_container.py)</text>
  <rect fill="#dbeafe" stroke="#1e40af" x="54" y="128" width="175" height="90" rx="5"/>
  <text class="hdr" x="64" y="148">0x000..0x07F</text>
  <text class="txt" x="64" y="168">128B Outer Header</text>
  <text class="txt" x="64" y="186">"Autorun.upg\0..."</text>
  <text class="txt" x="64" y="204">(Outside RSA sig)</text>

  <rect fill="#fee2e2" stroke="#991b1b" x="242" y="128" width="245" height="90" rx="5"/>
  <text class="hdr" x="252" y="148">0x080..0x10F (DLM Header)</text>
  <text class="txt" x="252" y="168">AES-128-CBC (09291094*4, IV=0)</text>
  <text class="txt" x="252" y="186">#DH@FiRm + model + body_len</text>
  <text class="txt" x="252" y="204">+0xF0: 32B MD5(hdr+0^32+body)</text>

  <rect fill="#dcfce7" stroke="#166534" x="500" y="128" width="380" height="90" rx="5"/>
  <text class="hdr" x="510" y="148">0x110..end-256 (Sequential Tagged Chunks)</text>
  <text class="txt" x="510" y="168">[4B Tag | 4B Flags | 4B Len | 16B AES("reserved mtk inc")]</text>
  <text class="txt" x="510" y="186">[+32B AES(SHA256(payload)) | Payload Data (XML / image)]</text>
  <text class="txt" x="510" y="204">Key/IV = MD5(33B AES_Prod.key / .iv incl. trailing \n)</text>

  <rect fill="#fef3c7" stroke="#b45309" x="892" y="128" width="234" height="90" rx="5"/>
  <text class="hdr" x="902" y="148">EOF - 256 Bytes</text>
  <text class="txt" x="902" y="168">256B RSA-2048 PKCS#1 v1.5</text>
  <text class="txt" x="902" y="186">Signs data[0x80 : -256]</text>
  <text class="txt" x="902" y="204">Checks PubKey in /ro_data</text>

  <!-- Verification Funnel -->
  <rect class="box" x="36" y="280" width="320" height="125"/>
  <text class="hdr" x="52" y="304">2. Integrity &amp; Auth Check (DLM)</text>
  <text class="txt" x="52" y="324">libdtv_common.so checks:</text>
  <text class="txt" x="52" y="342">-&gt; RSA-2048 verify (cmp r8,#0x20)</text>
  <text class="txt" x="52" y="360">-&gt; #DH@FiRm AES magic + body MD5</text>
  <text class="txt" x="52" y="378">-&gt; Chunk "reserved mtk inc"+SHA256</text>
  <text class="txt" x="52" y="394">-&gt; Parses &lt;UPGRADE&gt; ixml chunk</text>

  <rect class="box" x="400" y="280" width="335" height="125"/>
  <text class="hdr" x="416" y="304">3. libmtkapp.so Dispatch</text>
  <text class="txt" x="416" y="324">_phm_upg_model_start_upgrade</text>
  <text class="txt" x="416" y="342">Branches on &lt;METHOD&gt; (sub_404f28)</text>
  <text class="txt" x="416" y="360">and &lt;TAG&gt; bank-toggle rules</text>
  <text class="txt" x="416" y="378">(0x40ae80..0x40ae9c):</text>
  <text class="txt" x="416" y="394">-&gt; 3rdp explicitly skips A/B swap!</text>

  <path class="arr" d="M 356 342 L 400 342" marker-end="url(#a)"/>

  <!-- Fail branch: METHOD=PART (r6==0) -->
  <rect class="fail" x="780" y="280" width="364" height="165"/>
  <text class="hdr" x="796" y="304">FAIL PATH A: METHOD=PART (r6 == 0)</text>
  <text class="txt" x="796" y="324">0x404fa4 formats "/dev/nand_%d"</text>
  <text class="txt" x="796" y="342">Example: TAG=3rdp -&gt; "/dev/nand_10"</text>
  <text class="txt" x="796" y="360">Kernel only exports /dev/mtd* devices!</text>
  <text class="txt" x="796" y="378">c_fm_erase_flash_part returns -22 ENOENT</text>
  <text class="txt" x="796" y="396">TV stalls at "..." for ~8s then aborts:</text>
  <text class="hdr" x="796" y="420">"REINICIAR OU TENTAR NOVAMENTE"</text>

  <path class="arr-r" d="M 735 335 L 780 335" marker-end="url(#ar)"/>

  <!-- Fail branch B: 3rdp PMTD or Modified SquashFS -->
  <rect class="fail" x="36" y="440" width="520" height="145"/>
  <text class="hdr" x="52" y="464">FAIL PATH B: METHOD=PMTD / Custom SquashFS on 3rdA/3rdB</text>
  <text class="txt" x="52" y="484">1. Even if METHOD=PMTD resolves "/dev/mtd9" / "/dev/mtd10":</text>
  <text class="txt" x="52" y="502">   _phm_upg_model_start_upgrade skips EEPROM bank switch on 3rdp.</text>
  <text class="txt" x="52" y="520">2. Any custom SquashFS repacked without OEM NFSB RSA-1024 private key</text>
  <text class="txt" x="52" y="538">   breaks nfsb_rsa_check on next boot (dm-verity blocks mount -&gt; hang/brick).</text>
  <text class="txt" x="52" y="556">3. Requires exact external NAND chip programmer to unbrick corrupted mtd.</text>

  <path class="arr-r" d="M 480 405 L 480 440" marker-end="url(#ar)"/>

  <!-- Safe Pass Path: smth FILE mtd12 -->
  <rect class="pass" x="590" y="470" width="554" height="175"/>
  <text class="hdr" x="606" y="494">LOCK-COMPLIANT RW PATH: TAG=smth + METHOD=FILE -&gt; mtd12 (/3rd_rw)</text>
  <text class="txt" x="606" y="516">1. Container: 19,905 B Autorun.upg wrapping POSIX ustar .tgz payload</text>
  <text class="txt" x="606" y="534">2. Signed via dev/prod RSA key matching TV's /ro_data public key store</text>
  <text class="txt" x="606" y="552">3. dtv_svc preserves /3rd_rw/nettv when customer_version marker present</text>
  <text class="txt" x="606" y="570">4. libnettv.so merges /3rd_rw/nettv/opera_new.ini -&gt; /tmp/opera_home/</text>
  <text class="txt" x="606" y="588">5. Leaves kerA/B, rfsA/B, 3rdA/B 100% stock &amp; NFSB-intact (zero brick risk)</text>
  <text class="txt" x="606" y="616">Verified end-to-end offline via build_safe_rw_upg.py &amp; verify_upg_container.py</text>

  <path class="arr-g" d="M 650 405 L 650 470" marker-end="url(#ag)"/>

  <!-- Bottom Note -->
  <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" x="36" y="665" width="1108" height="72"/>
  <text class="hdr" x="54" y="690">Cryptographic &amp; Epistemic Scope Note</text>
  <text class="txt" x="54" y="712">No factory private RSA signing key or OEM AES secret is redistributed. Unit tests validate full UPG container wrapping/unwrapping</text>
  <text class="txt" x="54" y="728">deterministically using ephemeral RSA-2048 keys generated inside isolated temporary storage.</text>
</svg>
